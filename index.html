<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body{
margin:0;
overflow:hidden;
}

#social{
position:fixed;

right:20px;
top:50%;

transform:translateY(-50%);

display:none;
flex-direction:column;

gap:15px;

z-index:9999;
}

#social img{
width:70px;
height:70px;
}

</style>

</head>

<body>

<div id="social">

<a href="https://instagram.com/tuusuario">
<img src="instagram.png">
</a>

<a href="https://tiktok.com/@tuusuario">
<img src="tiktok.png">
</a>

<a href="https://wa.me/51999999999">
<img src="whatsapp.png">
</a>

</div>

<a-scene
mindar-image="
imageTargetSrc: target.mind;
autoStart: true;
uiScanning: yes;
uiLoading: yes;
"
color-space="sRGB"
renderer="colorManagement: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
>

<a-assets>

<video
id="promo"
src="video.mp4"
loop
muted
playsinline
crossorigin="anonymous"
></video>

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled: false"
></a-camera>

<a-entity mindar-image-target="targetIndex: 0">

</a-entity>

</a-scene>

<a-box
position="0 0 0"
color="red"
depth="0.2"
height="0.2"
width="0.2">
</a-box>

<script>

const video =
document.querySelector("#promo");

const target =
document.querySelector(
"[mindar-image-target]"
);

target.addEventListener(
"targetFound",
()=>{

video.play();

document
.getElementById("social")
.style.display="flex";

}
);

target.addEventListener(
"targetLost",
()=>{

document
.getElementById("social")
.style.display="none";

}
);

</script>

</body>

</html>
