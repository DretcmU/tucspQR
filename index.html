<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Video</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
}

#social{

    position:fixed;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    display:none;

    flex-direction:column;

    gap:15px;

    z-index:999999;
}

#social a{

    width:65px;
    height:65px;

    display:flex;

    justify-content:center;
    align-items:center;

    background:white;

    border-radius:15px;

    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

#social img{

    width:45px;
    height:45px;
}

#log{

    position:fixed;

    top:10px;
    left:10px;

    background:rgba(0,0,0,0.75);

    color:#00ff00;

    padding:10px;

    z-index:999999;

    font-size:12px;

    max-width:300px;
}

</style>

</head>

<body>

<div id="log">
Iniciando...
</div>

<div id="social">

    <a
    href="https://instagram.com/tuna.ucsp"
    target="_blank">

        <img src="instagram.png">

    </a>

    <a
    href="https://facebook.com/tunaucsp"
    target="_blank">

        <img src="facebook.png">

    </a>

    <a
    href="https://tiktok.com/@dretcm"
    target="_blank">

        <img src="tiktok.png">

    </a>

    <a
    href="https://wa.me/51999999999"
    target="_blank">

        <img src="whatsapp.png">

    </a>

</div>

<a-scene

mindar-image="
imageTargetSrc: ./targets.mind;
autoStart: true;
uiScanning: true;
uiLoading: true;
"

color-space="sRGB"

renderer="
colorManagement:true;
physicallyCorrectLights:true;
"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="
enabled:false
"

>

<a-assets>

<video
id="promo"
src="./video.mp4"
loop
muted
playsinline
crossorigin="anonymous"
></video>

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

<a-entity
id="target"
mindar-image-target="targetIndex: 0">

    <a-video
    src="#promo"
    position="0 0.4 0"
    width="1.8"
    height="1.0"
    rotation="0 0 0">
    </a-video>

</a-entity>

</a-scene>

<script>

const logDiv =
document.getElementById("log");

function log(msg)
{
    console.log(msg);

    logDiv.innerHTML +=
    "<br>" + msg;
}

log("Pagina iniciada");

const target =
document.getElementById("target");

const social =
document.getElementById("social");

const video =
document.getElementById("promo");

target.addEventListener(
"targetFound",
async ()=>{

    log("TARGET ENCONTRADO");

    social.style.display =
    "flex";

    try
    {
        await video.play();

        log(
        "VIDEO REPRODUCIENDO"
        );
    }
    catch(err)
    {
        log(
        "ERROR VIDEO: "
        + err
        );
    }

});

target.addEventListener(
"targetLost",
()=>{

    log("TARGET PERDIDO");

    social.style.display =
    "none";

    video.pause();

});

window.onerror =
function(msg)
{
    log(
    "ERROR: "
    + msg
    );
};

</script>

</body>
</html>
