<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>MindAR Debug</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#log{
    position:fixed;

    left:10px;
    top:10px;

    width:90%;
    max-height:40%;

    overflow:auto;

    background:rgba(0,0,0,0.8);

    color:#00ff00;

    font-family:monospace;
    font-size:14px;

    padding:10px;

    z-index:999999;
}

</style>

</head>

<body>

<div id="log"></div>

<a-scene
    id="scene"
    mindar-image="
        imageTargetSrc: ./target.mind;
        autoStart: true;
        uiScanning: true;
        uiLoading: true;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
>

    <a-camera
        position="0 0 0"
        look-controls="enabled:false">
    </a-camera>

    <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">

        <a-box
            color="red"
            width="0.3"
            height="0.3"
            depth="0.3">
        </a-box>

    </a-entity>

</a-scene>

<script>

const logDiv =
document.getElementById("log");

function log(msg)
{
    console.log(msg);

    logDiv.innerHTML += msg + "<br>";

    logDiv.scrollTop =
    logDiv.scrollHeight;
}

log("Pagina iniciada");

window.onerror =
function(msg, src, line)
{
    log(
        "ERROR: " +
        msg +
        " linea:" +
        line
    );
};

if(window.AFRAME)
{
    log("AFRAME OK");
}
else
{
    log("AFRAME NO CARGADO");
}

fetch("./target.mind")
.then(r =>
{
    log(
        "target.mind status = " +
        r.status
    );

    return r.blob();
})
.then(blob =>
{
    log(
        "target.mind bytes = " +
        blob.size
    );
})
.catch(err =>
{
    log(
        "ERROR cargando target.mind"
    );
});

const scene =
document.querySelector("#scene");

scene.addEventListener(
    "loaded",
    () =>
    {
        log("SCENE LOADED");
    }
);

scene.addEventListener(
    "renderstart",
    () =>
    {
        log("RENDER START");
    }
);

const target =
document.querySelector("#target");

target.addEventListener(
    "targetFound",
    () =>
    {
        log(
            "TARGET ENCONTRADO"
        );
    }
);

target.addEventListener(
    "targetLost",
    () =>
    {
        log(
            "TARGET PERDIDO"
        );
    }
);

setInterval(
    () =>
    {
        log("heartbeat");
    },
    5000
);

</script>

</body>
</html>
